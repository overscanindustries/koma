<title>Koma</title>

<script>
  // Theme before first paint, so there is no flash: the owner's choice, else the system's, else dark.
  (function () {
    var t = null;
    try { t = localStorage.getItem('koma.theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
