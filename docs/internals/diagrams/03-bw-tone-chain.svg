<text x="36" y="188" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MONITOR-START PATH: LCD PREVIEW, RUNS BEFORE THE UPDATE GATE</text>
<rect x="24" y="308" width="1152" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
<text x="36" y="324" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TABLES AND THE SPARE SLOT</text>
<rect x="24" y="460" width="1152" height="96" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
<text x="36" y="476" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SHUTTER PATH</text>
