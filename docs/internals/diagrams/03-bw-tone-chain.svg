<rect x="560" y="590" width="20" height="12" rx="3" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
<text x="588" y="599" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">emulated patch, not used</text>
