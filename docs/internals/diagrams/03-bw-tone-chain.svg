<text x="120.0" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">IMG SET menu row</text>
<text x="120.0" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">row table 0x1c1f18</text>
<text x="120.0" y="110" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cursor to value 0x1bd451</text>
<rect x="288" y="64" width="176" height="60" rx="6" fill="#f5f5f5"/>
<rect x="288" y="64" width="176" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="376.0" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Image mode 0x1b030</text>
<text x="376.0" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3 = B&amp;W, 6 = B&amp;W (TE)</text>
<text x="376.0" y="110" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0 HARD, 1 NORMAL, 2 SOFT</text>
<rect x="544" y="64" width="176" height="60" rx="6" fill="#f5f5f5"/>
<rect x="544" y="64" width="176" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="632.0" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detail screen 0x5b7e4</text>
<text x="632.0" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">routed by 0x7e626, mode 3</text>
<text x="632.0" y="110" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">contrast first, sharpness next</text>
<rect x="800" y="64" width="176" height="60" rx="6" fill="#f5f5f5"/>
<rect x="800" y="64" width="176" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="888.0" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contrast byte 0x1b197</text>
<text x="888.0" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1-5, default 3</text>
<text x="888.0" y="110" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TE uses 0x1b1a7</text>
<rect x="800" y="200" width="176" height="60" rx="6" fill="#f5f5f5"/>
<rect x="800" y="200" width="176" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="888.0" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Getter 0x92cc8</text>
<text x="888.0" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">contrast by image mode</text>
<text x="888.0" y="246" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2.31 had it at 0x69c68</text>
<rect x="544" y="200" width="176" height="60" rx="6" fill="#f5f5f5"/>
<rect x="544" y="200" width="176" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="632.0" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Monitor start 0x92050</text>
<text x="632.0" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">callers 0x985a0, 0xa1154</text>
<text x="632.0" y="246" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">also writes 0x1201800c</text>
<rect x="288" y="200" width="176" height="60" rx="6" fill="#f5f5f5"/>
<rect x="288" y="200" width="176" height="60" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
<text x="376.0" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LUT select 0x8ffc8</text>
<text x="376.0" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">8ffc8(selector, 0)</text>
<text x="376.0" y="246" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">selector 0x1e..0x22</text>
<rect x="32" y="200" width="176" height="60" rx="6" fill="#f5f5f5"/>
<rect x="32" y="200" width="176" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="120.0" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LUT transfers</text>
<text x="120.0" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CC1 0x166334 (0x12014014)</text>
<text x="120.0" y="246" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CC2 0x16d31c (0x1201811c)</text>
<rect x="32" y="336" width="480" height="72" rx="6" fill="#f5f5f5"/>
<rect x="32" y="336" width="480" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="44" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Five stock tables, 4096 entries, 0x2000 B each</text>
<text x="44" y="370" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">0x1e c1 0x193b30 | 0x1f c2 0x195b30 | 0x20 c3 0x19bb30</text>
<text x="44" y="382" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">0x21 c4 0x197b30 | 0x22 c5 0x199b30</text>
<text x="44" y="394" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">byte-identical in every held release, 1.08 to 2.40</text>
<rect x="560" y="336" width="608" height="72" rx="6" fill="#f5f5f5"/>
<rect x="560" y="336" width="608" height="72" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
<text x="572" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Spare slot 0xe: table 0x19db30</text>
<text x="572" y="370" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">stock: inverted curve, called only by factory adjust 0xdc7d0 and console 0xd0be0</text>
<text x="572" y="382" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">emulated gate at 0x5721c: sel 0x22 &amp;&amp; [0x1b030]==3 &amp;&amp; [0x23b085]==0 -&gt; 0xe</text>
<text x="572" y="394" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">EMU only; Koma uploads curves from a module instead</text>
<rect x="32" y="484" width="176" height="60" rx="6" fill="#f5f5f5"/>
<rect x="32" y="484" width="176" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="120.0" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shot upload 0x9733a</text>
<text x="120.0" y="518" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">normal shot, full press</text>
<text x="120.0" y="530" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0x900f4 CC1 / 0x90278 CC2</text>
<rect x="288" y="484" width="176" height="60" rx="6" fill="#f5f5f5"/>
<rect x="288" y="484" width="176" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="376.0" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Uploader 0x90408</text>
<text x="376.0" y="518" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">own cached byte 0x1f4db3</text>
<text x="376.0" y="530" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">calls 0x16d31c</text>
<text x="520" y="512" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">0x92050 overwrites the LUTs without updating the cached selector byte,</text>
<text x="520" y="532" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">so a custom B&amp;W curve must always be re-uploaded (EMU).</text>
