<text x="32" y="652" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">1.08 to 2.40 changes 36 bytes in 0x1b18c..0x1b1b2 plus the checksum, then saves the block. A second boot changes nothing.</text>
<text x="32" y="672" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">ADJ slots 3 and 4 (0x1b191, 0x1b192) stay 0xff: no migration writes them, matching Ricoh's note that they read OFF after the update.</text>
<text x="32" y="692" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">A block written by 2.10 reaches 2.40 with 0x1b193 = 0xff, because its group marker is already U.</text>
