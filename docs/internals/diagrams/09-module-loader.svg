<rect x="248" y="74" width="44" height="12" rx="2" fill="#f5f5f5"/>
<text x="270.0" y="83" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STARTUP</text>
<rect x="524" y="74" width="52" height="12" rx="2" fill="#f5f5f5"/>
<text x="550.0" y="83" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST-GATE</text>
<rect x="820" y="74" width="20" height="12" rx="2" fill="#f5f5f5"/>
<text x="830.0" y="83" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BL</text>
<rect x="980" y="168" width="28" height="12" rx="2" fill="#f5f5f5"/>
<text x="994.0" y="177" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOAD</text>
<rect x="812" y="240" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="832.0" y="249" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HANDLE</text>
<rect x="532" y="240" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="552.0" y="249" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUM OK</text>
<rect x="248" y="240" width="44" height="12" rx="2" fill="#f5f5f5"/>
<text x="270.0" y="249" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PATCHES</text>
<rect x="980" y="334" width="28" height="12" rx="2" fill="#f5f5f5"/>
<text x="994.0" y="343" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPEN</text>
<rect x="756" y="394" width="52" height="12" rx="2" fill="#f5f5f5"/>
<text x="782.0" y="403" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ BODY</text>
<rect x="420" y="384" width="60" height="12" rx="2" fill="#f5f5f5"/>
<text x="450.0" y="393" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">R0 = TABLE</text>
<rect x="32" y="64" width="200" height="60" rx="6" fill="#f5f5f5"/>
<rect x="32" y="64" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="132.0" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MainCtrl startup 0x1e7ac</text>
<text x="132.0" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">task priority 0x5a</text>
<text x="132.0" y="110" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">image runs from RAM</text>
<rect x="312" y="64" width="200" height="60" rx="6" fill="#f5f5f5"/>
<rect x="312" y="64" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="412.0" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Update gate 0x1eb22</text>
<text x="412.0" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">unchanged: recovery as stock</text>
<text x="412.0" y="110" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nothing before it moves</text>
<rect x="592" y="64" width="200" height="60" rx="6" fill="#f5f5f5"/>
<rect x="592" y="64" width="200" height="60" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
<text x="692.0" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hook site 0x281ee</text>
<text x="692.0" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">original bl 0x282cc</text>
<text x="692.0" y="110" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">becomes bl loader</text>
<rect x="872" y="64" width="200" height="60" rx="6" fill="#f5f5f5"/>
<rect x="872" y="64" width="200" height="60" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
<text x="972.0" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Loader (Dcfs island)</text>
<text x="972.0" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cave at 0x57f78</text>
<text x="972.0" y="110" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">calls 0x282cc, then loads</text>
<rect x="872" y="224" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect x="872" y="224" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="972.0" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Probe and open</text>
<text x="972.0" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">waits for card flag 0x1bd3a8</text>
<text x="972.0" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">(up to 250 x sleep(10))</text>
<text x="972.0" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">opens /ATA1/GRMOD.BIN</text>
<rect x="592" y="224" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect x="592" y="224" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="692.0" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validate and load</text>
<text x="692.0" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">reads 20-byte header, checks</text>
<text x="692.0" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pool-alloc body 0x15f024</text>
<text x="692.0" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">requires EOF, then checksum</text>
<rect x="312" y="224" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect x="312" y="224" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="412.0" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Module entry</text>
<text x="412.0" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Thumb: r0 = service table</text>
<text x="412.0" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">r1 = body base, r2 = length</text>
<text x="412.0" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">return 0: loader frees body</text>
<rect x="32" y="224" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect x="32" y="224" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="132.0" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Effects in RAM</text>
<text x="132.0" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">write into the live image:</text>
<text x="132.0" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tone tables, SNAP word,</text>
<text x="132.0" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">exposure count, Thumb BLs</text>
<rect x="872" y="384" width="296" height="72" rx="6" fill="#f5f5f5"/>
<rect x="872" y="384" width="296" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="884" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">GRMOD.BIN</text>
<text x="884" y="418" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">GRMD, format 1, flags 0, body length,</text>
<text x="884" y="430" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">entry offset, checksum (20-byte header)</text>
<text x="884" y="442" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">no file or bad header or sum: stock boot</text>
<rect x="32" y="384" width="240" height="72" rx="6" fill="#f5f5f5"/>
<rect x="32" y="384" width="240" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="44" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Per-image loader table</text>
<text x="44" y="418" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">same bl f000f86d in 6 images:</text>
<text x="44" y="430" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">GR 2.40, 2.31, 2.01 0x281ee; 1.08 0x281ce;</text>
<text x="44" y="442" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">500G wide 0x27f5a; R3 0x28702</text>
<rect x="312" y="484" width="520" height="72" rx="6" fill="#f5f5f5"/>
<rect x="312" y="484" width="520" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="324" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Service table (ABI 1, version word 0x240)</text>
<text x="324" y="518" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">pool_alloc 0x15f025 | pool_free 0x15f085 | pool handle 0x2bf81c</text>
<text x="324" y="530" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">file_open 0x55dc1 | file_read 0x56025 | file_close 0x55f0d</text>
<text x="324" y="542" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">key funnel 0x517dd | LUT upload 0x8ffc9 | irq_set 0x1c5b4 | sleep 0x288f7</text>
<text x="32" y="596" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">HW: this loader (generation 1) runs on both bodies. Generation 2 also tries /IROM/GRMOD.BIN when no card file opens (not drawn). Built packages (*.grmod) are copied as GRMOD.BIN.</text>
<text x="32" y="616" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">A module touches the firmware only through the service table and reaches stock behaviour when the file is absent or fails a check. Settings offsets and LUT addresses still differ per image.</text>
<line x1="32" y1="632" x2="1168" y2="632" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
