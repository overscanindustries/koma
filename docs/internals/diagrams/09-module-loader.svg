<text x="586" y="651" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">card file</text>
<rect x="657" y="642" width="20" height="12" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="685" y="651" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">table</text>
