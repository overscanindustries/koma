<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="module-loader-title module-loader-desc">
<title id="module-loader-title">Card-module loader architecture</title>
<desc id="module-loader-desc">Boot-time flow of a flash-once loader that reads a module file from the card, hands it a service table and lets it patch the live RAM image, with the ABI shared across six images.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
